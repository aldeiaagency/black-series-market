<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Black Label Market">
  <defs>
    <linearGradient id="chrome-main" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="30%" stop-color="#D2D2D2"/>
      <stop offset="55%" stop-color="#C0C0C0"/>
      <stop offset="80%" stop-color="#A8A8A8"/>
      <stop offset="100%" stop-color="#909090"/>
    </linearGradient>
    <linearGradient id="chrome-mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#787878"/>
      <stop offset="20%" stop-color="#C8C8C8"/>
      <stop offset="40%" stop-color="#F0F0F0"/>
      <stop offset="55%" stop-color="#E0E0E0"/>
      <stop offset="75%" stop-color="#B0B0B0"/>
      <stop offset="100%" stop-color="#787878"/>
    </linearGradient>
    <linearGradient id="chrome-muted" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
  </defs>

  <!-- BL Monogram -->
  <text x="200" y="100"
    font-family="'Cormorant Garamond', 'Palatino Linotype', Georgia, serif"
    font-size="86"
    font-weight="300"
    letter-spacing="-6"
    text-anchor="middle"
    fill="url(#chrome-mono)">BL</text>

  <!-- BLACK LABEL -->
  <text x="200" y="140"
    font-family="'Cormorant Garamond', 'Palatino Linotype', Georgia, serif"
    font-size="30"
    font-weight="300"
    letter-spacing="12"
    text-anchor="middle"
    fill="url(#chrome-main)">BLACK LABEL</text>

  <!-- Left rule -->
  <line x1="56" y1="162" x2="120" y2="162" stroke="url(#chrome-muted)" stroke-width="0.7"/>

  <!-- MARKET -->
  <text x="200" y="170"
    font-family="'Arial', 'Helvetica Neue', system-ui, sans-serif"
    font-size="11"
    font-weight="300"
    letter-spacing="9"
    text-anchor="middle"
    fill="url(#chrome-muted)">MARKET</text>

  <!-- Right rule -->
  <line x1="280" y1="162" x2="344" y2="162" stroke="url(#chrome-muted)" stroke-width="0.7"/>
</svg>
